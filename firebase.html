<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Firebase Auto Write</title>
</head>
<body>
    <h2>Firebase 自動寫入測試</h2>
 <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    // 引入 App Check Enterprise 模組
    import { initializeAppCheck, ReCaptchaEnterpriseProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app-check.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCCucKWk3784_UqLAGwOGi_jdjbQElLXTA",
        authDomain: "fir-20260114-f9236.firebaseapp.com",
        databaseURL: "https://fir-20260114-f9236-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "fir-20260114-f9236",
        storageBucket: "fir-20260114-f9236.firebasestorage.app",
        messagingSenderId: "793812463500",
        appId: "1:793812463500:web:2d5ae70a466ed93c48f0a9"
    };

    const app = initializeApp(firebaseConfig);

    // 初始化 App Check (使用截圖中的 siteKey)
    const appCheck = initializeAppCheck(app, {
      provider: new ReCaptchaEnterpriseProvider('6LfxDEosAAAAAIC1A2SVMy4Ensrmxdmj6HyLsOi6'),
      isTokenAutoRefreshEnabled: true
    });

    const db = getDatabase(app);

    // 自動寫入邏輯
    set(ref(db, 'autoTest'), {
        content: "hello456",
        time: new Date().toISOString()
    }).then(() => {
        console.log("寫入成功！");
    }).catch((err) => {
        console.error("寫入失敗（可能是 App Check 擋掉了 localhost）：", err);
    });
</script>
</body>
</html>
